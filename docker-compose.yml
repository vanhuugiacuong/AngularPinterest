version: '3.8'

services:
  clip-service:
    build:
      context: ./backend/services/clip-service
      dockerfile: Dockerfile
    container_name: clip-service-container
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: unless-stopped

  segmentation-service:
    build:
      context: ./backend/services/segmentation-service
      dockerfile: Dockerfile
    container_name: segmentation-service-container
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    restart: unless-stopped
