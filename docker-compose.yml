version: '3.8'

services:
  clip-service:
    build:
      context: ./backend/services/clip-service
      dockerfile: Dockerfile
    container_name: clip-service-container
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      # Minimum combined probability on NSFW prompts (0-1) before an image is
      # rejected by the create-post moderation check. Raise it to allow more
      # borderline images through, lower it to be stricter.
      - NSFW_THRESHOLD=0.35
    volumes:
      # Persists the downloaded CLIP model weights (~600MB) across container
      # rebuilds — without this, `docker-compose up --build` re-downloads
      # them from Hugging Face every time.
      - clip-model-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  clip-model-cache:
