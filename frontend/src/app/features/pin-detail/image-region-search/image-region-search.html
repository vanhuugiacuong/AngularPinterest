<div class="relative w-full flex items-center justify-center select-none">
  <img
    #stageImg
    [src]="imageUrl"
    alt="Ảnh đang chọn vùng để tìm kiếm"
    class="w-full h-auto max-h-[720px] object-contain block pointer-events-none"
    (load)="onImageLoad(stageImg)"
  />

  @if (containedRect().width > 0) {
    <!-- Dim mask around the selection — image stays fully visible underneath -->
    <div
      class="absolute bg-ink/70 pointer-events-none"
      [style.left.px]="0"
      [style.top.px]="0"
      [style.right.px]="0"
      [style.height.px]="selectionPixelRect().y"
    ></div>
    <div
      class="absolute bg-ink/70 pointer-events-none"
      [style.left.px]="0"
      [style.bottom.px]="0"
      [style.right.px]="0"
      [style.top.px]="selectionPixelRect().y + selectionPixelRect().height"
    ></div>
    <div
      class="absolute bg-ink/70 pointer-events-none"
      [style.left.px]="0"
      [style.top.px]="selectionPixelRect().y"
      [style.width.px]="selectionPixelRect().x"
      [style.height.px]="selectionPixelRect().height"
    ></div>
    <div
      class="absolute bg-ink/70 pointer-events-none"
      [style.right.px]="0"
      [style.top.px]="selectionPixelRect().y"
      [style.left.px]="selectionPixelRect().x + selectionPixelRect().width"
      [style.height.px]="selectionPixelRect().height"
    ></div>

    <!-- Selection box -->
    <div
      class="absolute border-2 border-accent cursor-move touch-none rounded-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
      tabindex="0"
      role="group"
      aria-label="Vùng ảnh đã chọn. Kéo để di chuyển, dùng phím mũi tên để tinh chỉnh vị trí, giữ Shift và phím mũi tên để đổi kích thước, Enter để tìm kiếm, Escape để hủy."
      [style.left.px]="selectionPixelRect().x"
      [style.top.px]="selectionPixelRect().y"
      [style.width.px]="selectionPixelRect().width"
      [style.height.px]="selectionPixelRect().height"
      (pointerdown)="onSelectionPointerDown($event)"
      (pointermove)="onDragPointerMove($event)"
      (pointerup)="onDragPointerUp($event)"
      (pointercancel)="onDragPointerUp($event)"
      (keydown)="onSelectionKeydown($event)"
    >
      @for (handle of resizeHandles; track handle) {
        <div
          class="crop-handle"
          [class.crop-handle-nw]="handle === 'nw'"
          [class.crop-handle-ne]="handle === 'ne'"
          [class.crop-handle-sw]="handle === 'sw'"
          [class.crop-handle-se]="handle === 'se'"
          aria-hidden="true"
          (pointerdown)="onHandlePointerDown($event, handle)"
          (pointermove)="onDragPointerMove($event)"
          (pointerup)="onDragPointerUp($event)"
          (pointercancel)="onDragPointerUp($event)"
        ></div>
      }
    </div>
  }

  <!-- Toolbar -->
  <div
    class="absolute bottom-4 left-1/2 -translate-x-1/2 flex flex-wrap items-center justify-center gap-2 bg-surface-high/95 backdrop-blur-md rounded-control shadow-card px-3 py-2 z-20 max-w-[95%]"
  >
    <button
      type="button"
      (click)="submitSearch()"
      [disabled]="isSubmitting()"
      class="h-9 px-4 bg-gradient-brand cta-shape text-text-on-accent text-xs font-bold cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1.5 border-none outline-none focus-visible:ring-2 focus-visible:ring-accent"
    >
      @if (isSubmitting()) {
        <span class="material-symbols-outlined text-base animate-spin leading-none" aria-hidden="true">progress_activity</span>
        Đang tìm...
      } @else {
        <span class="material-symbols-outlined text-base leading-none" aria-hidden="true">search</span>
        Tìm vùng đã chọn
      }
    </button>
    <button
      type="button"
      (click)="selectFullImage()"
      [disabled]="isSubmitting()"
      class="h-9 px-3.5 rounded-control bg-surface-elevated hover:bg-surface text-xs font-bold text-text cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed border-none outline-none focus-visible:ring-2 focus-visible:ring-accent"
    >
      Chọn toàn bộ ảnh
    </button>
    <button
      type="button"
      (click)="resetSelection()"
      [disabled]="isSubmitting()"
      class="h-9 px-3.5 rounded-control bg-surface-elevated hover:bg-surface text-xs font-bold text-text cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed border-none outline-none focus-visible:ring-2 focus-visible:ring-accent"
    >
      Đặt lại
    </button>
    <button
      type="button"
      (click)="cancel()"
      [disabled]="isSubmitting()"
      class="h-9 px-3.5 rounded-control bg-surface-elevated hover:bg-surface text-xs font-bold text-text-muted hover:text-text cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed border-none outline-none focus-visible:ring-2 focus-visible:ring-accent"
    >
      Hủy
    </button>
  </div>

  @if (submitError()) {
    <p
      class="absolute top-3 left-1/2 -translate-x-1/2 max-w-[90%] text-center text-xs font-semibold text-white bg-error/90 px-3 py-1.5 rounded-control z-20"
      role="alert"
    >
      {{ submitError() }}
    </p>
  }
</div>
