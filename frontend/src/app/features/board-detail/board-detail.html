<div class="min-h-screen bg-white dark:bg-[#121212] text-black dark:text-white flex flex-col font-sans relative transition-colors">
  <!-- Navbar handles fixed top header and floating bottom tab bar -->
  <app-navbar></app-navbar>

  <!-- Main Content Area: padded down to clear fixed header, padded up to clear floating bottom bar -->
  <div class="flex-1 pt-16 pb-24 flex flex-col min-w-0">
    <main class="flex-1 w-full mx-auto px-8 py-8 flex flex-col max-w-none items-center">

      <!-- Back to Profile Button -->
      <div class="w-full flex justify-start mb-6">
        <button
          (click)="goBackToProfile()"
          class="w-10 h-10 rounded-full bg-white dark:bg-[#1e1e1e] hover:bg-gray-100 dark:hover:bg-[#2a2a2a] flex items-center justify-center border border-gray-200 dark:border-[#333] cursor-pointer shadow-sm active:scale-95 transition-all select-none border-none outline-none text-[#211922] dark:text-white"
          title="Quay lại trang cá nhân"
        >
          <span class="material-symbols-outlined text-xl font-semibold">arrow_back</span>
        </button>
      </div>

      <!-- Loading State -->
      <div *ngIf="isLoading()" class="flex-1 flex flex-col items-center justify-center py-20">
        <div class="w-10 h-10 border-4 border-[#B15CAA] border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-[#62625b] dark:text-[#999] mt-4 font-semibold">Đang tải chi tiết bảng...</p>
      </div>

      <ng-container *ngIf="!isLoading() && board() as b">
        <!-- Board Header -->
        <div class="flex flex-col items-center gap-2 max-w-[600px] mb-12 text-center">
          <div class="flex items-center gap-2.5">
            <h1 class="text-3xl font-extrabold text-[#211922] dark:text-white tracking-tight">{{ b.name }}</h1>
            <span
              *ngIf="b.isSecret"
              class="material-symbols-outlined text-xl text-gray-500 dark:text-[#999] font-bold"
              title="Bảng bí mật (chỉ bạn xem được)"
            >
              lock
            </span>

            <!-- Owner options: rename / delete -->
            <div class="relative" *ngIf="isOwner()">
              <button
                (click)="toggleOptionsMenu($event)"
                class="w-9 h-9 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] flex items-center justify-center cursor-pointer border-none outline-none text-[#211922] dark:text-white"
                title="Tùy chọn bảng"
              >
                <span class="material-symbols-outlined text-xl">more_horiz</span>
              </button>

              <div
                *ngIf="showOptionsMenu()"
                class="absolute left-1/2 -translate-x-1/2 top-11 w-52 bg-white dark:bg-[#1e1e1e] rounded-2xl shadow-2xl border border-gray-100 dark:border-[#333] py-1.5 z-50 text-left animate-fade-in"
              >
                <button
                  (click)="openEditModal($event)"
                  class="w-full text-left px-4 py-2.5 text-sm font-bold text-black dark:text-white hover:bg-gray-50 dark:hover:bg-[#2a2a2a] cursor-pointer border-none outline-none bg-transparent flex items-center gap-2.5"
                >
                  <span class="material-symbols-outlined text-[18px]">edit</span>
                  Đổi tên / chỉnh sửa
                </button>
                <button
                  (click)="deleteCurrentBoard($event)"
                  class="w-full text-left px-4 py-2.5 text-sm font-bold text-[#DC2626] hover:bg-gray-50 dark:hover:bg-[#2a2a2a] cursor-pointer border-none outline-none bg-transparent flex items-center gap-2.5"
                >
                  <span class="material-symbols-outlined text-[18px]">delete</span>
                  Xóa bảng
                </button>
              </div>
            </div>
          </div>
          <p class="text-sm text-[#62625b] dark:text-[#999] font-medium max-w-[450px] leading-relaxed mt-1" *ngIf="b.description">
            {{ b.description }}
          </p>
          <span class="text-xs font-bold text-gray-400 dark:text-[#777] mt-2 uppercase tracking-wide">
            {{ pins().length }} ý tưởng / hình ảnh
          </span>
        </div>

        <!-- Pins Masonry Grid inside the Board -->
        <div class="w-full">
          <div class="columns-2 sm:columns-3 md:columns-4 lg:columns-5 xl:columns-6 gap-4 w-full">
            <div
              *ngFor="let pin of pins()"
              (click)="navigateToPin(pin.id)"
              class="break-inside-avoid mb-4 group cursor-pointer flex flex-col"
            >
              <!-- Card container -->
              <div class="relative overflow-hidden rounded-[24px] bg-[#f6f6f3] dark:bg-[#1e1e1e] shadow-[0_2px_8px_rgba(0,0,0,0.02)] transition-all duration-300">
                <img
                  [src]="pin.image"
                  [alt]="pin.title"
                  class="w-full object-cover rounded-[24px] block transition-transform duration-300 group-hover:scale-102"
                />

                <!-- Hover Overlay -->
                <div class="absolute inset-0 bg-black/35 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex flex-col justify-between p-3 text-white z-10">
                  <!-- Remove from Board action -->
                  <div class="flex justify-end">
                    <button
                      (click)="removePin(pin.id, $event)"
                      class="bg-black/60 hover:bg-black text-white font-bold px-3 py-1.5 rounded-full text-[11px] cursor-pointer transition-colors border-none outline-none"
                      title="Gỡ ảnh này khỏi bảng"
                    >
                      Gỡ khỏi bảng
                    </button>
                  </div>

                  <!-- Bottom Info -->
                  <div class="flex items-center justify-end w-full min-w-0">
                    <button
                      (click)="$event.stopPropagation()"
                      class="w-7 h-7 rounded-full bg-white text-black flex items-center justify-center hover:bg-gray-100 cursor-pointer border-none outline-none animate-fade-in"
                    >
                      <span class="material-symbols-outlined text-sm font-bold">more_horiz</span>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Metadata title -->
              <span class="mt-2 px-1 text-xs font-bold text-[#211922] dark:text-white truncate block">
                {{ pin.title }}
              </span>
            </div>
          </div>

          <!-- Empty Board State -->
          <div
            *ngIf="pins().length === 0"
            class="py-20 flex flex-col items-center justify-center text-center gap-3 bg-gray-50 dark:bg-[#1e1e1e] rounded-[32px] border border-dashed border-[#dadad3] dark:border-[#333] w-full"
          >
            <span class="material-symbols-outlined text-4xl text-gray-400">photo_library</span>
            <p class="text-xs font-semibold text-gray-500 dark:text-[#999]">Bảng này hiện chưa lưu hình ảnh nào.</p>
            <a
              href="/feed"
              class="mt-2 h-9 px-4 bg-black dark:bg-white text-white dark:text-black hover:bg-gray-800 dark:hover:bg-gray-200 rounded-full text-xs font-bold flex items-center justify-center cursor-pointer transition-colors border-none outline-none decoration-none"
            >
              Khám phá ảnh trên Feed
            </a>
          </div>
        </div>
      </ng-container>
    </main>
  </div>

  <!-- Edit Board Modal -->
  <div
    *ngIf="showEditModal()"
    class="fixed inset-0 bg-black/50 z-[999] flex items-center justify-center p-4 backdrop-blur-sm"
  >
    <div class="bg-white dark:bg-[#1e1e1e] w-full max-w-[500px] rounded-[32px] p-8 shadow-2xl flex flex-col gap-6 text-left border border-gray-100 dark:border-[#333] animate-fade-in">
      <div class="flex items-center justify-between">
        <h2 class="text-2xl font-extrabold text-[#211922] dark:text-white">Chỉnh sửa bảng</h2>
        <button
          (click)="closeEditModal()"
          class="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] flex items-center justify-center cursor-pointer border-none outline-none text-black dark:text-white select-none"
        >
          <span class="material-symbols-outlined font-bold text-lg">close</span>
        </button>
      </div>

      <form (submit)="saveBoardEdit(); $event.preventDefault();" class="flex flex-col gap-4">
        <!-- Name -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-gray-700 dark:text-[#ccc]">Tên bảng <span class="text-red-500">*</span></label>
          <input
            type="text"
            name="editBoardName"
            [(ngModel)]="editName"
            class="w-full bg-[#f6f6f3] dark:bg-[#2a2a2a] border border-transparent focus:border-gray-200 dark:focus:border-[#444] focus:bg-white dark:focus:bg-[#2a2a2a] outline-none rounded-full px-4 h-12 text-sm text-black dark:text-white transition-all"
            required
            [disabled]="isSavingEdit()"
          />
        </div>

        <!-- Description -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-gray-700 dark:text-[#ccc]">Mô tả (Không bắt buộc)</label>
          <textarea
            name="editBoardDesc"
            [(ngModel)]="editDesc"
            rows="3"
            class="w-full bg-[#f6f6f3] dark:bg-[#2a2a2a] border border-transparent focus:border-gray-200 dark:focus:border-[#444] focus:bg-white dark:focus:bg-[#2a2a2a] outline-none rounded-2xl p-4 text-sm text-black dark:text-white transition-all resize-none"
            [disabled]="isSavingEdit()"
          ></textarea>
        </div>

        <!-- Secret option -->
        <div class="flex items-start gap-3 py-2 cursor-pointer select-none">
          <input
            type="checkbox"
            id="editSecretCheckbox"
            name="editBoardSecret"
            [(ngModel)]="editSecret"
            class="mt-1 w-4 h-4 rounded accent-[#B15CAA] cursor-pointer"
            [disabled]="isSavingEdit()"
          />
          <div class="flex flex-col">
            <label for="editSecretCheckbox" class="text-sm font-bold text-black dark:text-white cursor-pointer">Giữ bảng này bí mật</label>
            <span class="text-xs text-[#62625b] dark:text-[#999]">Chỉ bạn mới có thể xem bảng này và các hình ảnh lưu bên trong.</span>
          </div>
        </div>

        <!-- Footer buttons -->
        <div class="flex items-center justify-end gap-3 mt-4">
          <button
            type="button"
            (click)="closeEditModal()"
            class="h-11 px-6 rounded-full text-sm font-bold bg-gray-100 dark:bg-[#2a2a2a] hover:bg-gray-200 dark:hover:bg-[#333] text-black dark:text-white cursor-pointer transition-colors border-none outline-none select-none"
            [disabled]="isSavingEdit()"
          >
            Hủy
          </button>
          <button
            type="submit"
            class="h-11 px-6 rounded-full text-sm font-bold bg-[#B15CAA] hover:bg-[#8F4A8B] text-white cursor-pointer transition-all active:scale-95 border-none outline-none"
            [disabled]="isSavingEdit() || !editName.trim()"
          >
            {{ isSavingEdit() ? 'Đang lưu...' : 'Lưu' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
