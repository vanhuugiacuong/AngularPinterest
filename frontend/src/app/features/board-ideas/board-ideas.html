<div class="min-h-screen bg-white dark:bg-[#121212] text-black dark:text-white flex flex-col font-sans">
  <main class="flex-1 w-full max-w-[1400px] mx-auto px-8 py-8 flex flex-col">

    <!-- Top bar -->
    <div class="w-full flex items-center gap-4 mb-8">
      <button
        (click)="goBack()"
        class="w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-[#2a2a2a] flex items-center justify-center border-none outline-none cursor-pointer text-black dark:text-white shrink-0"
        title="Quay lại bảng"
      >
        <span class="material-symbols-outlined text-2xl">arrow_back</span>
      </button>
      <h1 class="text-2xl font-extrabold text-[#211922] dark:text-white tracking-tight mx-auto">
        Ý tưởng khác
      </h1>
      <div class="w-10 shrink-0"></div>
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading()" class="flex-1 flex flex-col items-center justify-center py-20">
      <div class="w-10 h-10 border-4 border-[#B15CAA] border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Masonry grid -->
    <div class="columns-2 sm:columns-3 md:columns-4 lg:columns-5 xl:columns-6 gap-4 w-full">
      <div
        *ngFor="let pin of ideaPins()"
        (click)="navigateToPin(pin.id)"
        class="break-inside-avoid mb-4 group cursor-pointer flex flex-col"
      >
        <div class="relative overflow-hidden rounded-[24px] bg-[#f6f6f3] dark:bg-[#1e1e1e] shadow-[0_2px_8px_rgba(0,0,0,0.02)] transition-all duration-300">
          <img
            [src]="pin.imageUrl"
            [alt]="pin.title"
            class="w-full object-cover rounded-[24px] block transition-transform duration-300 group-hover:scale-102"
          />

          <!-- One-click save straight into this board -->
          <button
            type="button"
            (click)="saveToBoard(pin, $event)"
            [disabled]="savingPinId() === pin.id"
            class="absolute top-2.5 right-2.5 w-9 h-9 rounded-full flex items-center justify-center shadow-md border-none outline-none cursor-pointer transition-colors disabled:opacity-60"
            [class.bg-[#B15CAA]]="isSaved(pin.id)"
            [class.text-white]="isSaved(pin.id)"
            [class.bg-white/90]="!isSaved(pin.id)"
            [class.text-black]="!isSaved(pin.id)"
            [title]="isSaved(pin.id) ? 'Đã lưu vào bảng' : 'Lưu vào bảng này'"
          >
            <span
              *ngIf="!isSaved(pin.id)"
              class="material-symbols-outlined text-lg rotate-45"
              style="font-variation-settings: 'FILL' 1"
            >push_pin</span>
            <span *ngIf="isSaved(pin.id)" class="material-symbols-outlined text-lg font-bold">check</span>
          </button>
        </div>

        <span class="mt-2 px-1 text-xs font-bold text-[#211922] dark:text-white truncate block">
          {{ pin.title }}
        </span>
      </div>
    </div>

    <div *ngIf="!isLoading() && ideaPins().length === 0" class="flex-1 flex flex-col items-center justify-center py-24 text-center gap-2">
      <span class="material-symbols-outlined text-4xl text-gray-400">explore_off</span>
      <p class="text-xs font-semibold text-gray-500 dark:text-[#999]">Chưa có ý tưởng nào để gợi ý.</p>
    </div>

  </main>
</div>
