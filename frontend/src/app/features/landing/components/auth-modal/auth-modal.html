<div
  *ngIf="visible()"
  class="nf-auth"
  [class.nf-auth--leaving]="leaving()"
  role="presentation"
  (click)="onBackdropClick()"
  (mousemove)="onPointerMove($event)"
  [style.--px]="px()"
  [style.--py]="py()"
>
  <!-- ================================================================ -->
  <!-- Floating object field. Sits BEHIND the glass panel, never          -->
  <!-- interactive. Two objects only — Nova blue (far) and Iris violet    -->
  <!-- (near) — echoing the Split Aperture Frame's two offset frames as   -->
  <!-- ambient light rather than a busy particle field. The panel's own   -->
  <!-- backdrop-filter blurs and refracts them as they pass behind it.    -->
  <!-- ================================================================ -->
  <div class="nf-auth__field" aria-hidden="true">
    <span class="nf-auth__obj nf-auth__obj--orb-blue nf-auth__obj--far"></span>
    <span class="nf-auth__obj nf-auth__obj--orb-purple nf-auth__obj--near"></span>
  </div>

  <!-- ================================================================ -->
  <!-- Liquid Glass panel                                                -->
  <!-- ================================================================ -->
  <div
    #panel
    tabindex="-1"
    class="nf-auth__panel"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="nf-auth-title"
  >
    <button type="button" class="nf-auth__close" (click)="requestClose()" aria-label="Đóng">
      <span class="material-symbols-outlined">close</span>
    </button>

    <div class="nf-auth__body">
      <img src="/logo-mark.png" alt="" aria-hidden="true" class="nf-auth__logo" />

      <span class="nf-auth__eyebrow">Creative Observatory</span>

      <h2 id="nf-auth-title" class="nf-auth__title">
        Đăng nhập vào <span class="nf-auth__title-accent">NovaFrame</span>
      </h2>

      <p class="nf-auth__lede">
        Tiếp tục bằng tài khoản Google để bước vào không gian sáng tạo của riêng bạn.
      </p>

      <!-- Submit control. Idle / pending states; the pending state is driven
           by the isSigningIn input that Landing sets around its existing
           signInWithGoogle() call. -->
      <button
        type="button"
        class="nf-auth__submit"
        [class.nf-auth__submit--busy]="isSigningIn"
        [disabled]="isSigningIn"
        [attr.aria-busy]="isSigningIn"
        (click)="loginRequested.emit()"
      >
        @if (isSigningIn) {
          <span class="nf-auth__spinner material-symbols-outlined">progress_activity</span>
          <span>Đang kết nối với Google…</span>
        } @else {
          <svg class="nf-auth__gicon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              fill="#EA4335"
            />
          </svg>
          <span>Đăng nhập bằng Google</span>
        }
      </button>

      <!-- Error state -->
      @if (errorMsg) {
        <p class="nf-auth__error" role="alert">
          <span class="material-symbols-outlined" aria-hidden="true">error</span>
          <span>Lỗi đăng nhập: {{ errorMsg }}</span>
        </p>
      }

      <p class="nf-auth__fine">
        Bằng việc tiếp tục, bạn đồng ý với
        <a href="#">Điều khoản Dịch vụ</a> và <a href="#">Chính sách Bảo mật</a> của chúng tôi.
      </p>
    </div>
  </div>
</div>
