<div class="min-h-screen bg-white dark:bg-[#121212] text-black dark:text-white flex flex-col font-sans relative transition-colors">
  <app-navbar></app-navbar>
  <div class="flex-1 pt-16 pl-28 pb-24 flex flex-col min-w-0">
    <main class="flex-1 w-full max-w-[600px] mx-auto px-6 py-6 flex flex-col">
      <h1 class="text-lg font-extrabold text-black dark:text-white mb-6">Thông báo</h1>

      <p *ngIf="loading()" class="text-xs text-center text-[#62625b] dark:text-[#999] py-8 select-none">Đang tải...</p>

      <div *ngIf="!loading() && notifications().length === 0" class="py-20 flex flex-col items-center justify-center text-center gap-3 bg-gray-50 dark:bg-[#1e1e1e] rounded-[32px] border border-dashed border-[#dadad3] dark:border-[#333] w-full">
        <span class="material-symbols-outlined text-4xl text-gray-400">notifications</span>
        <p class="text-xs font-semibold text-gray-500 dark:text-[#999]">Chưa có thông báo mới nào.</p>
        <p class="text-[11px] text-gray-400 dark:text-[#777] max-w-[280px]">Lượt thích, bình luận và người theo dõi mới sẽ xuất hiện ở đây.</p>
      </div>

      <div *ngIf="!loading() && notifications().length > 0" class="flex flex-col gap-1">
        <app-notification-item
          *ngFor="let notif of notifications()"
          [notification]="notif"
          (itemClick)="onNotificationClick($event)"
        ></app-notification-item>
      </div>
    </main>
  </div>
</div>
