<div
  *ngIf="open"
  class="nf-dialog-backdrop"
  (mousedown)="onBackdropMouseDown($event)"
  (click)="onBackdropClick($event)"
  role="presentation"
>
  <div
    #dialogEl
    (click)="$event.stopPropagation()"
    class="nf-dialog-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="publish-dialog-title"
    aria-describedby="publish-dialog-desc"
    tabindex="-1"
  >
    <!-- PROCESSING -->
    <div *ngIf="status === 'processing'" aria-live="polite">
      <div
        class="mx-auto mb-5 w-12 h-12 border-4 border-accent border-t-transparent rounded-full animate-spin"
        aria-hidden="true"
      ></div>
      <h2 id="publish-dialog-title" class="nf-dialog-title">{{ message }}</h2>
      <p id="publish-dialog-desc" class="nf-dialog-description">
        Vui lòng không đóng trang trong lúc NovaFrame đang đăng tác phẩm của bạn.
      </p>
    </div>

    <!-- SUCCESS -->
    <div *ngIf="status === 'success'" aria-live="polite">
      <div
        class="ppd-success-pop frame-trace frame-trace-active animate-trace-sweep mx-auto mb-5 w-12 h-12 rounded-full bg-gradient-brand flex items-center justify-center"
        aria-hidden="true"
      >
        <span class="material-symbols-outlined text-2xl text-text-on-accent">check</span>
      </div>
      <h2 id="publish-dialog-title" class="nf-dialog-title">Đăng ảnh thành công</h2>
      <p id="publish-dialog-desc" class="nf-dialog-description">Đang chuyển đến trang cá nhân của bạn…</p>
    </div>

    <!-- ERROR -->
    <div *ngIf="status === 'error'" aria-live="assertive">
      <div class="nf-dialog-icon nf-dialog-icon--destructive" aria-hidden="true">
        <span class="material-symbols-outlined">error</span>
      </div>
      <h2 id="publish-dialog-title" class="nf-dialog-title">Đăng ảnh thất bại</h2>
      <p id="publish-dialog-desc" class="nf-dialog-description">{{ errorMessage }}</p>
      <div class="nf-dialog-actions">
        <button type="button" (click)="onCloseClick()" class="nf-dialog-btn nf-dialog-btn--cancel">Đóng</button>
        <button #retryBtn type="button" (click)="onRetryClick()" class="nf-dialog-btn nf-dialog-btn--primary">
          Thử lại
        </button>
      </div>
    </div>
  </div>
</div>
