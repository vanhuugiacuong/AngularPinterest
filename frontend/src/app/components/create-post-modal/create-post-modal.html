<div class="cpm-overlay" (click)="close()">
  <div class="cpm-modal" (click)="$event.stopPropagation()">
    <div class="cpm-header">
      <h2 class="cpm-title">Tạo bài viết mới</h2>
      <button type="button" class="cpm-close-btn" (click)="close()" aria-label="Đóng">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div
      class="cpm-dropzone"
      [class.cpm-dropzone--dragging]="isDragging()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <div class="cpm-icon-wrap">
        <div class="cpm-icon-glow" aria-hidden="true"></div>
        <svg class="cpm-icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="cpmIconGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--pinhub-accent)" />
              <stop offset="100%" stop-color="#ff6fb5" />
            </linearGradient>
          </defs>
          <rect x="20" y="20" width="80" height="80" rx="14" stroke="url(#cpmIconGradient)" stroke-width="3" />
          <circle cx="40" cy="40" r="7" stroke="url(#cpmIconGradient)" stroke-width="3" />
          <path
            d="M28 84L46 64L58 74L72 54L92 84"
            stroke="url(#cpmIconGradient)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <div class="cpm-hint-group">
        <p class="cpm-hint">Kéo ảnh vào đây</p>
        <p class="cpm-subhint">Hỗ trợ JPG, PNG, WEBP — tối đa 20MB</p>
      </div>

      <button type="button" class="cpm-select-btn" (click)="triggerFileInput()">Chọn từ máy tính</button>

      <p class="cpm-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <input
        #fileInput
        type="file"
        class="cpm-hidden-input"
        multiple
        accept="image/jpeg,image/png,image/webp"
        (change)="onFileInputChange($event)"
      />
    </div>
  </div>
</div>
