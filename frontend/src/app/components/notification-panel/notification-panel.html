<!-- Backdrop -->
<div
  *ngIf="isOpen"
  (click)="closePanel()"
  class="fixed inset-0 bg-black/50 z-40 top-16"
  aria-hidden="true"
></div>

<!-- Notification Panel -->
<div
  [class.translate-x-0]="isOpen"
  [class.translate-x-full]="!isOpen"
  class="fixed right-0 top-16 h-[calc(100vh-4rem)] w-full sm:w-96 z-50 bg-surface border-l border-border shadow-card transition-transform duration-300 ease-out flex flex-col"
>
  <!-- Header -->
  <div class="flex justify-between items-center px-6 py-4 border-b border-border flex-shrink-0">
    <h2 class="text-lg font-semibold text-text">Thông báo</h2>
    <div class="flex gap-2">
      <button
        *ngIf="unreadCount > 0"
        (click)="markAllAsRead()"
        type="button"
        class="text-xs text-accent hover:text-accent/80 transition-colors px-2 py-1 rounded hover:bg-surface-elevated"
        title="Đánh dấu tất cả đã đọc"
      >
        Đánh dấu tất cả
      </button>
      <button
        (click)="closePanel()"
        type="button"
        class="text-text-muted hover:text-text transition-colors"
        aria-label="Đóng"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
  </div>

  <!-- Notifications List -->
  <div class="flex-1 overflow-y-auto">
    <!-- Empty State -->
    <div *ngIf="notifications.length === 0 && !isLoading" class="text-center py-12 text-text-muted flex flex-col items-center gap-3">
      <span class="material-symbols-outlined text-5xl opacity-30">notifications_none</span>
      <p class="text-sm">Không có thông báo nào</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex items-center justify-center py-8">
      <div class="w-6 h-6 border-2 border-accent border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Notifications -->
    <div *ngFor="let notif of notifications" class="border-b border-border last:border-b-0">
      <button
        (click)="markAsRead(notif)"
        type="button"
        [class.bg-surface-elevated]="!notif.isRead"
        class="w-full px-6 py-4 hover:bg-surface-elevated transition-colors text-left"
      >
        <div class="flex gap-3">
          <!-- Avatar -->
          <div class="flex-shrink-0">
            <app-user-avatar
              *ngIf="notif.sender"
              [src]="notif.sender.avatarUrl"
              [name]="notif.sender.username"
              [size]="40"
              [plan]="notif.sender.plan"
            ></app-user-avatar>
            <div *ngIf="!notif.sender" class="w-10 h-10 rounded-full bg-surface-elevated flex items-center justify-center flex-shrink-0">
              <span class="material-symbols-outlined text-accent text-lg">notifications</span>
            </div>
          </div>

          <!-- Content -->
          <div class="flex-1 min-w-0">
            <p class="text-sm text-text leading-snug">{{ notif.content }}</p>
            <p class="text-xs text-text-muted mt-1">{{ getTimeAgo(notif.createdAt) }}</p>
          </div>

          <!-- Pin thumbnail -->
          <div *ngIf="notif.pin?.imageUrl" class="flex-shrink-0">
            <img
              [src]="notif.pin!.imageUrl"
              [alt]="notif.pin!.title"
              class="w-10 h-10 rounded object-cover"
            />
          </div>

          <!-- Unread indicator -->
          <div *ngIf="!notif.isRead" class="flex-shrink-0 w-2 h-2 rounded-full bg-accent mt-1.5"></div>
        </div>
      </button>
    </div>
  </div>
</div>
