<div
  *ngIf="visualSearchService.isOpen()"
  class="fixed inset-0 bg-black/60 backdrop-blur-md z-[80] flex items-center justify-center p-4 animate-fade-in"
  (click)="visualSearchService.close()"
>
  <div
    class="bg-[#1e1e1e] w-full max-w-[420px] rounded-[28px] p-6 shadow-[0_30px_70px_rgba(0,0,0,0.6)] flex flex-col gap-4 text-left border border-white/10"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center gap-2.5">
      <span class="vs-crest shrink-0 w-9 h-9 rounded-[12px] flex items-center justify-center text-white">
        <span class="material-symbols-outlined text-[19px] leading-none">image_search</span>
      </span>
      <h2 class="flex-1 text-base font-extrabold text-white leading-snug">Tìm kiếm bằng hình ảnh</h2>
      <button
        (click)="visualSearchService.close()"
        title="Đóng"
        class="shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-white/[0.06] hover:bg-white/10 text-white/70 hover:text-white border border-white/10 outline-none cursor-pointer transition-colors"
      >
        <span class="material-symbols-outlined text-xl leading-none">close</span>
      </button>
    </div>

    <ng-container *ngIf="!visualSearchService.previewUrl()">
      <div
        class="vs-drop relative overflow-hidden rounded-2xl flex flex-col items-center justify-center p-8 text-center cursor-pointer"
        [class.vs-drop-active]="isDraggingOver()"
        (click)="uploadInput.click()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
      >
        <div class="vs-drop-glow" aria-hidden="true"></div>
        <span class="material-symbols-outlined vs-spark vs-spark-1" aria-hidden="true">auto_awesome</span>
        <span class="material-symbols-outlined vs-spark vs-spark-2" aria-hidden="true">auto_awesome</span>

        <span class="vs-drop-icon relative z-10 w-14 h-14 rounded-full flex items-center justify-center mb-3.5">
          <span class="material-symbols-outlined text-[26px] text-white">cloud_upload</span>
        </span>
        <p class="relative z-10 text-sm font-extrabold text-white">
          {{ isDraggingOver() ? 'Thả ảnh vào đây!' : 'Kéo thả hoặc nhấp để tải ảnh lên' }}
        </p>
        <span class="relative z-10 text-[11px] text-[#a29aac] mt-1.5">Hỗ trợ JPG, PNG</span>
      </div>

      <input
        #uploadInput
        type="file"
        accept="image/*"
        class="hidden"
        (change)="onFileSelected($event)"
      />
      <input
        #captureInput
        type="file"
        accept="image/*"
        capture="environment"
        class="hidden"
        (change)="onFileSelected($event)"
      />

      <button
        type="button"
        (click)="captureInput.click()"
        class="h-11 rounded-full font-bold text-sm text-white bg-white/[0.06] hover:bg-white/10 border border-white/10 transition-colors cursor-pointer outline-none flex items-center justify-center gap-2"
      >
        <span class="material-symbols-outlined text-xl leading-none">photo_camera</span>
        Chụp ảnh
      </button>
    </ng-container>

    <ng-container *ngIf="visualSearchService.previewUrl() as preview">
      <div class="relative rounded-2xl overflow-hidden bg-white/[0.04] border border-white/10">
        <img [src]="preview" class="w-full max-h-[320px] object-contain" />
        <div
          *ngIf="visualSearchService.isLoading()"
          class="absolute inset-0 bg-black/60 backdrop-blur-[2px] flex flex-col items-center justify-center gap-3"
        >
          <!-- Vòng quét lan toả cho thấy đang phân tích ảnh -->
          <span class="vs-scan" aria-hidden="true"></span>
          <span class="text-xs font-bold text-white">Đang tìm kiếm...</span>
        </div>
      </div>

      <div class="flex gap-2 justify-end" *ngIf="!visualSearchService.isLoading()">
        <button
          (click)="visualSearchService.reset()"
          class="h-10 px-5 rounded-full font-bold text-sm text-white bg-white/[0.06] hover:bg-white/10 border border-white/10 transition-colors cursor-pointer outline-none"
        >
          Chọn ảnh khác
        </button>
        <button
          (click)="visualSearchService.submit()"
          class="grad-brand h-10 px-5 rounded-full font-bold text-sm text-white transition-all hover:-translate-y-0.5 shadow-[0_10px_24px_-8px_rgba(249,64,131,0.6)] cursor-pointer border-none outline-none"
        >
          Tìm kiếm
        </button>
      </div>
    </ng-container>
  </div>
</div>
