<div
  *ngIf="visualSearchService.isOpen()"
  class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[80] flex items-center justify-center p-4 animate-fade-in"
  (click)="visualSearchService.close()"
>
  <div
    class="bg-white dark:bg-[#1e1e1e] w-full max-w-[420px] rounded-[28px] p-6 shadow-2xl flex flex-col gap-4 text-left border border-gray-100 dark:border-[#333]"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between">
      <h2 class="text-base font-extrabold text-black dark:text-white leading-snug">Tìm kiếm bằng hình ảnh</h2>
      <button
        (click)="visualSearchService.close()"
        title="Đóng"
        class="shrink-0 w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#f6f6f3] dark:hover:bg-[#2a2a2a] text-[#62625b] dark:text-[#999] border-none outline-none cursor-pointer"
      >
        <span class="material-symbols-outlined text-xl leading-none">close</span>
      </button>
    </div>

    <ng-container *ngIf="!visualSearchService.previewUrl()">
      <div
        class="drag-drop-area rounded-2xl bg-[#f6f6f3] dark:bg-[#2a2a2a] flex flex-col items-center justify-center p-8 text-center cursor-pointer"
        (click)="uploadInput.click()"
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event)"
      >
        <span class="material-symbols-outlined text-4xl text-gray-400 mb-3">cloud_upload</span>
        <p class="text-xs font-bold text-gray-700 dark:text-[#ccc]">Kéo thả hoặc nhấp để tải ảnh lên</p>
        <span class="text-[10px] text-gray-500 dark:text-[#999] mt-2">Hỗ trợ JPG, PNG</span>
      </div>

      <input
        #uploadInput
        type="file"
        accept="image/*"
        class="hidden"
        (change)="onFileSelected($event)"
      />
      <input
        #captureInput
        type="file"
        accept="image/*"
        capture="environment"
        class="hidden"
        (change)="onFileSelected($event)"
      />

      <button
        type="button"
        (click)="captureInput.click()"
        class="h-11 rounded-full font-bold text-sm text-[#211922] dark:text-white bg-[#f0f0ed] dark:bg-[#2a2a2a] hover:bg-[#e5e5e1] dark:hover:bg-[#333] transition-colors cursor-pointer border-none outline-none flex items-center justify-center gap-2"
      >
        <span class="material-symbols-outlined text-xl leading-none">photo_camera</span>
        Chụp ảnh
      </button>
    </ng-container>

    <ng-container *ngIf="visualSearchService.previewUrl() as preview">
      <div class="relative rounded-2xl overflow-hidden bg-[#f6f6f3] dark:bg-[#2a2a2a]">
        <img [src]="preview" class="w-full max-h-[320px] object-contain" />
        <div
          *ngIf="visualSearchService.isLoading()"
          class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center gap-3"
        >
          <div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
          <span class="text-xs font-bold text-white">Đang tìm kiếm...</span>
        </div>
      </div>

      <div class="flex gap-2 justify-end" *ngIf="!visualSearchService.isLoading()">
        <button
          (click)="visualSearchService.reset()"
          class="h-10 px-5 rounded-full font-bold text-sm text-[#211922] dark:text-white bg-[#f0f0ed] dark:bg-[#2a2a2a] hover:bg-[#e5e5e1] dark:hover:bg-[#333] transition-colors cursor-pointer border-none outline-none"
        >
          Chọn ảnh khác
        </button>
        <button
          (click)="visualSearchService.submit()"
          class="h-10 px-5 rounded-full font-bold text-sm text-white bg-[#F94083] hover:bg-[#dc2f6d] transition-colors cursor-pointer border-none outline-none"
        >
          Tìm kiếm
        </button>
      </div>
    </ng-container>
  </div>
</div>
