<div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] flex flex-col-reverse gap-3 items-center pointer-events-none w-full px-4">
  <div
    *ngFor="let toast of toastService.toasts()"
    class="toast-pop pointer-events-auto relative max-w-[420px] w-full sm:w-auto"
  >
    <div
      class="rounded-full pl-4 pr-3 py-3 flex items-center gap-3 shadow-[0_10px_28px_rgba(0,0,0,0.35)] bg-[#211922]"
    >
      <span class="flex-1 min-w-0 text-[14px] font-bold text-white leading-snug">{{ toast.message }}</span>

      <button
        (click)="toastService.dismiss(toast.id)"
        class="shrink-0 w-7 h-7 flex items-center justify-center rounded-full hover:bg-white/10 text-white/60 border-none outline-none cursor-pointer"
        title="Đóng"
      >
        <span class="material-symbols-outlined text-base leading-none select-none">close</span>
      </button>
    </div>

    <div class="h-[3px] rounded-full overflow-hidden mt-1 mx-4 bg-white/10">
      <div class="h-full toast-countdown bg-white/40" [style.animation-duration.ms]="toast.durationMs"></div>
    </div>
  </div>
</div>
