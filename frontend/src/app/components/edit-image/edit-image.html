<div class="eim-root">
  <div class="eim-header">
    <button type="button" class="eim-back-btn" (click)="onBack()" aria-label="Quay lại">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <h2 class="eim-title">Chỉnh sửa</h2>

    <button
      type="button"
      class="eim-next-btn"
      [disabled]="exporting()"
      (click)="onNext()"
    >{{ exporting() ? 'Đang xử lý…' : 'Tiếp' }}</button>
  </div>

  <div class="eim-stage">
    <div class="eim-canvas" (pointerdown)="onCanvasPointerDown()">
      <div class="eim-frame" *ngIf="imageUrl() as url">
        <img
          [src]="url"
          alt="Ảnh đang chỉnh sửa"
          class="eim-image"
          [style.filter]="imageFilter()"
          (load)="onImageLoad()"
        />

        <!-- Free-hand drawing layer. Interactive only in draw mode; otherwise it just shows
             the finished strokes and lets pointer events fall through to the text layers. -->
        <canvas
          #drawCanvas
          class="eim-draw-canvas"
          [class.eim-draw-canvas--active]="drawing()"
          (pointerdown)="onDrawPointerDown($event)"
          (pointermove)="onDrawPointerMove($event)"
          (pointerup)="onDrawPointerUp($event)"
          (pointercancel)="onDrawPointerUp($event)"
        ></canvas>

        <!-- Draggable text layers -->
        <div
          *ngFor="let layer of layers(); trackBy: trackLayer"
          class="eim-tl"
          [class.eim-tl--selected]="layer.id === selectedId()"
          [class.eim-tl--locked]="drawing()"
          [style.left.%]="layer.xPct"
          [style.top.%]="layer.yPct"
          (pointerdown)="onLayerPointerDown(layer, $event)"
          (pointermove)="onLayerPointerMove($event)"
          (pointerup)="onLayerPointerUp(layer, $event)"
        >
          <textarea
            *ngIf="editingId() === layer.id; else textView"
            class="eim-tl-input"
            rows="1"
            [style.color]="layer.color"
            placeholder="Nhập văn bản"
            (input)="onLayerText(layer, $event)"
            (blur)="onEditorBlur($event)"
            (pointerdown)="$event.stopPropagation()"
          ></textarea>
          <ng-template #textView>
            <span class="eim-tl-text" [style.color]="layer.color">{{ layer.text }}</span>
          </ng-template>

          <button
            *ngIf="layer.id === selectedId()"
            type="button"
            class="eim-tl-delete"
            aria-label="Xóa lớp chữ"
            (pointerdown)="$event.stopPropagation()"
            (click)="onDeleteSelected($event)"
          >
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <!-- Draggable / resizable sticker layers -->
        <div
          *ngFor="let st of stickers(); trackBy: trackSticker"
          class="eim-sticker"
          [class.eim-sticker--selected]="st.id === selectedId()"
          [class.eim-sticker--locked]="drawing()"
          [style.left.%]="st.xPct"
          [style.top.%]="st.yPct"
          [style.fontSize.px]="stickerFontPx(st)"
          (pointerdown)="onStickerPointerDown(st, $event)"
          (pointermove)="onStickerPointerMove($event)"
          (pointerup)="onStickerPointerUp(st, $event)"
        >
          <span class="eim-sticker-emoji">{{ st.emoji }}</span>

          <button
            *ngIf="st.id === selectedId()"
            type="button"
            class="eim-sticker-delete"
            aria-label="Xóa nhãn dán"
            (pointerdown)="$event.stopPropagation()"
            (click)="onDeleteSelected($event)"
          >
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            </svg>
          </button>

          <span
            *ngIf="st.id === selectedId()"
            class="eim-sticker-resize"
            aria-hidden="true"
            (pointerdown)="onResizePointerDown(st, $event)"
            (pointermove)="onResizePointerMove($event)"
            (pointerup)="onResizePointerUp($event)"
            (pointercancel)="onResizePointerUp($event)"
          ></span>
        </div>
      </div>
    </div>

    <!-- Sticker picker — grid panel above the toolbar; a transparent backdrop closes it. -->
    <div class="eim-sticker-backdrop" *ngIf="stickerPanelOpen()" (pointerdown)="closeStickerPanel()"></div>
    <div class="eim-sticker-panel" *ngIf="stickerPanelOpen()" (pointerdown)="$event.stopPropagation()">
      <div class="eim-sticker-grid">
        <button
          type="button"
          *ngFor="let emoji of stickerEmojis"
          class="eim-sticker-choice"
          (click)="pickSticker(emoji)"
          [attr.aria-label]="'Thêm nhãn dán ' + emoji"
        >{{ emoji }}</button>
      </div>
    </div>

    <!-- Effects panel — brightness / contrast / saturation sliders; a transparent backdrop
         closes it, same pattern as the sticker picker. -->
    <div class="eim-sticker-backdrop" *ngIf="effectsPanelOpen()" (pointerdown)="closeEffectsPanel()"></div>
    <div class="eim-effects-panel" *ngIf="effectsPanelOpen()" (pointerdown)="$event.stopPropagation()">
      <div class="eim-effects-row">
        <span class="eim-effects-label">Độ sáng</span>
        <input
          type="range"
          class="eim-effects-slider"
          min="0"
          max="200"
          [value]="brightness()"
          (input)="onBrightnessInput($event)"
        />
        <span class="eim-effects-value">{{ brightness() }}%</span>
      </div>
      <div class="eim-effects-row">
        <span class="eim-effects-label">Tương phản</span>
        <input
          type="range"
          class="eim-effects-slider"
          min="0"
          max="200"
          [value]="contrast()"
          (input)="onContrastInput($event)"
        />
        <span class="eim-effects-value">{{ contrast() }}%</span>
      </div>
      <div class="eim-effects-row">
        <span class="eim-effects-label">Bão hòa</span>
        <input
          type="range"
          class="eim-effects-slider"
          min="0"
          max="200"
          [value]="saturation()"
          (input)="onSaturationInput($event)"
        />
        <span class="eim-effects-value">{{ saturation() }}%</span>
      </div>
      <button type="button" class="eim-effects-reset" (click)="resetEffects()">Đặt lại</button>
    </div>

    <!-- Colour palette — vertical strip on the right, shown only while a text layer is selected.
         mousedown is prevented on the whole strip so a click here never pulls focus off the
         text <textarea> (which would blur-finalize an empty layer). -->
    <div
      class="eim-palette"
      *ngIf="paletteVisible()"
      (mousedown)="$event.preventDefault()"
      (pointerdown)="$event.stopPropagation()"
    >
      <button
        type="button"
        *ngFor="let c of textColors"
        class="eim-swatch"
        [class.eim-swatch--active]="isActivePaletteColor(c.value)"
        [style.background]="c.value"
        [attr.aria-label]="c.name"
        [title]="c.name"
        (click)="onPaletteColor(c.value)"
      ></button>
    </div>

    <!-- Pill toolbar — sits in the dark canvas area below the image frame, never over it. -->
    <div class="eim-toolbar" *ngIf="!drawing()">
      <button
        type="button"
        class="eim-tool-btn"
        [class.eim-tool-btn--busy]="downloading()"
        [disabled]="downloading()"
        (click)="onToolClick('download')"
        (mouseenter)="showTooltip($event, 'Tải xuống')"
        (mouseleave)="hideTooltip()"
        aria-label="Tải xuống"
      >
        <span *ngIf="downloading()" class="eim-spinner" aria-label="Đang xử lý"></span>
        <svg *ngIf="!downloading()" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4V15M12 15L7 10M12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5 19H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

      <button
        type="button"
        class="eim-tool-btn"
        [class.eim-tool-btn--active]="stickerPanelOpen()"
        (click)="onToolClick('sticker')"
        (mouseenter)="showTooltip($event, 'Nhãn dán')"
        (mouseleave)="hideTooltip()"
        aria-label="Nhãn dán"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2" />
          <circle cx="9" cy="10" r="1.1" fill="currentColor" />
          <circle cx="15" cy="10" r="1.1" fill="currentColor" />
          <path d="M8.5 14C9.2 15.2 10.5 16 12 16C13.5 16 14.8 15.2 15.5 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

      <button
        type="button"
        class="eim-tool-btn"
        (click)="onToolClick('draw')"
        (mouseenter)="showTooltip($event, 'Vẽ')"
        (mouseleave)="hideTooltip()"
        aria-label="Vẽ"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20L4.6 16.4L15 6L18 9L7.6 19.4L4 20Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M13.5 7.5L16.5 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

      <button
        type="button"
        class="eim-tool-btn eim-tool-btn--text"
        (click)="onToolClick('text')"
        (mouseenter)="showTooltip($event, 'Thêm chữ')"
        (mouseleave)="hideTooltip()"
        aria-label="Thêm chữ"
      >
        <span class="eim-tool-aa">Aa</span>
      </button>

      <button
        type="button"
        class="eim-tool-btn"
        [class.eim-tool-btn--active]="effectsPanelOpen()"
        (click)="onToolClick('effects')"
        (mouseenter)="showTooltip($event, 'Hiệu ứng')"
        (mouseleave)="hideTooltip()"
        aria-label="Hiệu ứng"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L13.6 9.2L20 11L13.6 12.8L12 19L10.4 12.8L4 11L10.4 9.2L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M18.5 15L19.2 17L21 17.8L19.2 18.6L18.5 20.5L17.8 18.6L16 17.8L17.8 17L18.5 15Z" fill="currentColor" />
        </svg>
      </button>
    </div>

    <!-- Draw-mode toolbar: undo (left) · 4 brushes (centre) · done (right). -->
    <div class="eim-toolbar eim-draw-toolbar" *ngIf="drawing()">
      <button
        type="button"
        class="eim-tool-btn eim-draw-action"
        (click)="undoStroke()"
        [disabled]="strokes().length === 0"
        (mouseenter)="showTooltip($event, 'Hoàn tác')"
        (mouseleave)="hideTooltip()"
        aria-label="Hoàn tác"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 7L4 12L9 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M4 12H15C18 12 20 14 20 17V19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <span class="eim-draw-sep"></span>

      <button
        type="button"
        *ngFor="let b of brushes"
        class="eim-tool-btn"
        [class.eim-tool-btn--active]="brush() === b.id"
        (click)="selectBrush(b.id)"
        (mouseenter)="showTooltip($event, b.tooltip)"
        (mouseleave)="hideTooltip()"
        [attr.aria-label]="b.tooltip"
        [attr.aria-pressed]="brush() === b.id"
      >
        <ng-container [ngSwitch]="b.id">
          <svg *ngSwitchCase="'pen'" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 20L4.6 16.4L15 6L18 9L7.6 19.4L4 20Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M13.5 7.5L16.5 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'marker'" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 3L21 8L12.5 19.5L7 20L6 15L14 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <path d="M6.2 15.2L11 19.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M4 22H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <svg *ngSwitchCase="'neon'" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 19L5.5 15.5L14 7L17 10L8.5 18.5L5 19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M18.5 3L19.4 5.6L22 6.5L19.4 7.4L18.5 10L17.6 7.4L15 6.5L17.6 5.6L18.5 3Z" fill="currentColor" />
          </svg>
          <svg *ngSwitchCase="'eraser'" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 20L4 16C3.2 15.2 3.2 13.9 4 13.1L12 5.1C12.8 4.3 14.1 4.3 14.9 5.1L19.9 10.1C20.7 10.9 20.7 12.2 19.9 13L12.9 20H8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <path d="M8.5 9.5L15 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M9 20H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </ng-container>
      </button>

      <span class="eim-draw-sep"></span>

      <button
        type="button"
        class="eim-draw-done"
        (click)="finishDrawing()"
        (mouseenter)="showTooltip($event, 'Xong')"
        (mouseleave)="hideTooltip()"
      >Xong</button>
    </div>

    <div
      class="eim-tooltip"
      [class.eim-tooltip--visible]="tooltipVisible()"
      [style.left.px]="tooltipLeft()"
      [style.top.px]="tooltipTop()"
      role="tooltip"
    >
      {{ tooltipText() }}
    </div>
  </div>

  <!-- Discard-changes confirmation — shown when back/close is pressed with unsaved edits. -->
  <div class="eim-discard-backdrop" *ngIf="showDiscardDialog()">
    <div
      class="eim-discard-dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="eim-discard-title"
      aria-describedby="eim-discard-desc"
    >
      <h3 id="eim-discard-title" class="eim-discard-title">Bỏ ảnh?</h3>
      <p id="eim-discard-desc" class="eim-discard-desc">Nếu quay lại bây giờ thì bạn sẽ mất ảnh này</p>
      <div class="eim-discard-actions">
        <button type="button" class="eim-discard-keep" (click)="onKeepEditing()">Giữ lại</button>
        <button type="button" class="eim-discard-discard" (click)="onDiscardChanges()">Bỏ ảnh</button>
      </div>
    </div>
  </div>
</div>
