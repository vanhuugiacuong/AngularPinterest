<div class="cim-root">
  <div class="cim-header">
    <button type="button" class="cim-back-btn" (click)="onBack()" aria-label="Quay lại">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <h2 class="cim-title">Cắt</h2>

    <button
      type="button"
      class="cim-next-btn"
      [disabled]="isGeneratingCrops() || files.length === 0"
      (click)="onNext()"
    >Tiếp</button>
  </div>

  <div class="cim-stage-wrap" (click)="closePopups()">
    <!-- Empty list: no tray, no cropper — just a prompt to pick images via the library icon. -->
    <div class="cim-empty" *ngIf="files.length === 0">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="3" y="3" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2" />
        <path d="M9 21H19a2 2 0 002-2V9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <p>Chưa có ảnh nào. Bấm biểu tượng thư viện để chọn ảnh.</p>
    </div>

    <div class="cim-cropper-viewport">
      <image-cropper
        *ngIf="currentFile() as file"
        class="cim-cropper"
        [imageFile]="file"
        [aspectRatio]="currentAspectRatio()"
        [maintainAspectRatio]="true"
        [containWithinAspectRatio]="false"
        [format]="currentFormat()"
        output="blob"
        [imageQuality]="92"
        [hideResizeSquares]="true"
        [allowMoveImage]="true"
        [transform]="currentTransform()"
        (transformChange)="onTransformChange($event)"
        [cropper]="pendingCropperPosition()"
        (cropperChange)="onCropperPositionChange($event)"
        (cropperReady)="onCropperReady($event)"
        cropperFrameAriaLabel="Khung cắt ảnh"
      ></image-cropper>
    </div>

    <button
      type="button"
      *ngIf="files.length > 1 && currentIndex() > 0"
      class="cim-nav cim-nav-prev"
      (click)="goToPrev($event)"
      aria-label="Ảnh trước"
    >‹</button>

    <button
      type="button"
      *ngIf="files.length > 1 && currentIndex() < files.length - 1"
      class="cim-nav cim-nav-next"
      (click)="goToNext($event)"
      aria-label="Ảnh kế tiếp"
    >›</button>

    <div class="cim-toolbar-left" *ngIf="files.length > 0">
      <div class="cim-tool-btn-wrap">
        <button type="button" class="cim-tool-btn" (click)="toggleAspectPopup($event)" title="Tỷ lệ khung hình">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 9V4H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M15 4H20V9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M20 15V20H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M9 20H4V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="cim-aspect-popup" *ngIf="showAspectPopup()" (click)="$event.stopPropagation()">
          <button
            type="button"
            *ngFor="let opt of aspectOptions"
            class="cim-aspect-row"
            [class.cim-aspect-row--active]="currentAspect() === opt.key"
            (click)="selectAspect(opt.key)"
          >
            <span class="cim-aspect-label">{{ opt.label }}</span>

            <svg *ngIf="opt.key === 'original'" class="cim-aspect-shape" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6" />
              <circle cx="8.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.6" />
              <path d="M4 17L9 12L13 15L17 10L20 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>

            <svg *ngIf="opt.key === '1:1'" class="cim-aspect-shape" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="5" y="5" width="14" height="14" rx="1.5" stroke="currentColor" stroke-width="1.6" />
            </svg>

            <svg *ngIf="opt.key === '4:5'" class="cim-aspect-shape" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="7" y="3" width="10" height="18" rx="1.5" stroke="currentColor" stroke-width="1.6" />
            </svg>

            <svg *ngIf="opt.key === '16:9'" class="cim-aspect-shape" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="2" y="7" width="20" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Magnifier toggle for the zoom pill, sitting beside the aspect-ratio button.
           The pill expands rightward out of the magnifier toward the frame centre and
           never covers the aspect-ratio button on its left. -->
      <button
        type="button"
        class="cim-zoom-toggle"
        [class.cim-zoom-toggle--active]="zoomBarOpen()"
        (click)="toggleZoomBar($event)"
        (mouseenter)="showTooltip($event, 'Chọn mức thu phóng')"
        (mouseleave)="hideTooltip()"
        aria-label="Thu phóng"
        [attr.aria-pressed]="zoomBarOpen()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
          <path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

      <div
        class="cim-zoom-bar"
        [class.cim-zoom-bar--open]="zoomBarOpen()"
        [class.cim-zoom-bar--dragging]="zoomTrackDragging()"
        (click)="$event.stopPropagation()"
      >
        <div
          class="cim-zoom-track"
          (pointerdown)="onZoomTrackPointerDown($event)"
          (pointermove)="onZoomTrackPointerMove($event)"
          (pointerup)="onZoomTrackPointerUp()"
          (pointercancel)="onZoomTrackPointerUp()"
        >
          <div class="cim-zoom-track-base"></div>
          <div class="cim-zoom-track-fill" [style.width.%]="zoomPercent()"></div>
          <div class="cim-zoom-thumb" [style.left.%]="zoomPercent()"></div>
        </div>
      </div>
    </div>

    <div class="cim-toolbar-right">
      <button
        type="button"
        class="cim-multi-indicator"
        [class.cim-multi-indicator--active]="files.length > 1"
        (click)="openTrayFilePicker()"
        (mouseenter)="showTooltip($event, 'Mở thư viện file phương tiện')"
        (mouseleave)="hideTooltip()"
        aria-label="Mở thư viện file phương tiện"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2" />
          <path d="M9 21H19a2 2 0 002-2V9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <!-- Selected-images tray — sits just above the "Mở thư viện" icon, bottom-right of the stage.
         Add / remove / drag-to-reorder the images that will be posted, in order. Rendered ONLY
         when the picked-images list has at least one entry; an empty list shows just the
         "Mở thư viện" icon above. -->
    <div class="cim-tray" *ngIf="files.length > 0" (click)="$event.stopPropagation()">
      <div class="cim-tray-hint" *ngIf="reorderHintVisible()">Nhấp và kéo để sắp xếp lại</div>

      <div class="cim-tray-strip">
        <div
          class="cim-tray-thumb"
          *ngFor="let url of previewUrls(); let i = index"
          [class.cim-tray-thumb--active]="i === currentIndex()"
          [class.cim-tray-thumb--dragging]="i === dragIndex()"
          draggable="true"
          (dragstart)="onThumbDragStart(i, $event)"
          (dragover)="onThumbDragOver($event)"
          (drop)="onThumbDrop(i, $event)"
          (dragend)="onThumbDragEnd()"
          (click)="goToImage(i)"
        >
          <img [src]="url" alt="" class="cim-tray-thumb-img" />
          <button
            type="button"
            class="cim-tray-remove"
            (click)="removeImage(i, $event)"
            aria-label="Xóa ảnh này"
          >
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <button
          type="button"
          class="cim-tray-add"
          *ngIf="files.length < maxImages"
          (click)="openTrayFilePicker()"
          (mouseenter)="showTooltip($event, 'Biểu tượng dấu cộng')"
          (mouseleave)="hideTooltip()"
          aria-label="Biểu tượng dấu cộng"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <p class="cim-tray-limit" *ngIf="limitNoticeVisible()">Đã đạt giới hạn {{ maxImages }} ảnh</p>
    </div>

    <input
      #trayFileInput
      type="file"
      class="cim-tray-hidden-input"
      multiple
      accept="image/jpeg,image/png,image/webp"
      (change)="onTrayFilesPicked($event)"
    />

    <div
      class="cim-tooltip"
      [class.cim-tooltip--visible]="tooltipVisible()"
      [style.left.px]="tooltipLeft()"
      [style.top.px]="tooltipTop()"
      role="tooltip"
    >
      {{ tooltipText() }}
    </div>
  </div>
</div>
