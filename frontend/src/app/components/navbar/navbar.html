<!-- Floating Bottom Tab Bar: collapsed to just Home; hover (desktop) / long-press (mobile) fans the rest out in 3D -->
<div
  *ngIf="supabaseService.user()"
  #bottomNavEl
  class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 select-none nav-fan-perspective"
  (mouseenter)="onNavMouseEnter()"
  (mouseleave)="onNavMouseLeave()"
>
  <div class="relative w-14 h-14" [class.nav-fan-open]="isNavExpanded()">
    <!-- Explore -->
    <div
      (click)="navigateToExplore()"
      class="nav-petal petal-1"
      [style.background-color]="isExplorePage() ? '#000' : '#fff'"
      [style.color]="isExplorePage() ? '#fff' : '#000'"
      title="Khám phá"
    >
      <span class="material-symbols-outlined text-2xl">explore</span>
    </div>

    <!-- Create -->
    <div
      (click)="navigateToCreate()"
      class="nav-petal petal-2"
      [style.background-color]="isCreatePage() ? '#000' : '#fff'"
      [style.color]="isCreatePage() ? '#fff' : '#000'"
      title="Tạo"
    >
      <span class="material-symbols-outlined text-2xl">add</span>
    </div>

    <!-- Notifications (also covers chat/messages for now) -->
    <div
      (click)="navigateToNotifications()"
      class="nav-petal petal-3"
      [style.background-color]="isNotificationsPage() ? '#000' : '#fff'"
      [style.color]="isNotificationsPage() ? '#fff' : '#000'"
      title="Thông báo & Tin nhắn"
    >
      <span class="material-symbols-outlined text-2xl">notifications</span>
    </div>

    <!-- Profile -->
    <div
      (click)="navigateToMyProfile()"
      class="nav-petal petal-4"
      [style.background-color]="isProfilePage() ? '#000' : '#fff'"
      [style.color]="isProfilePage() ? '#fff' : '#000'"
      title="Cá nhân"
    >
      <span class="material-symbols-outlined text-2xl">person</span>
    </div>

    <!-- Home: always visible, anchors the fan. Tap = navigate, hold/hover = expand -->
    <button
      (click)="onHomeClick()"
      (touchstart)="onHomeTouchStart()"
      (touchend)="onHomeTouchEnd()"
      (touchcancel)="onHomeTouchEnd()"
      class="nav-home-btn"
      [style.background-color]="isFeedPage() ? '#000' : '#fff'"
      [style.color]="isFeedPage() ? '#fff' : '#000'"
      title="Trang chủ (giữ để mở menu)"
    >
      <span class="material-symbols-outlined text-2xl font-bold">home</span>
    </button>
  </div>
</div>

<!-- Header (Navbar) -->
<header
  class="fixed top-0 left-0 right-0 h-16 bg-white border-b border-[#dadad3] flex items-center justify-between px-6 z-40"
>
  <!-- Left Side: Show logo inside navbar ONLY when logged out -->
  <div
    *ngIf="!supabaseService.user()"
    (click)="onLogoClick()"
    class="flex items-center gap-2 cursor-pointer select-none"
  >
    <div class="w-8 h-8 rounded-full bg-[#B15CAA] text-white flex items-center justify-center">
      <span class="material-symbols-outlined text-lg leading-none font-bold">push_pin</span>
    </div>
    <span class="text-xl font-bold text-[#B15CAA] tracking-tight">Pinterest AI</span>
  </div>

  <!-- Center Search Bar: only shown once logged in -->
  <div
    *ngIf="supabaseService.user()"
    class="flex-1 mx-4 flex items-center gap-2 px-4 h-11 bg-[#e9e9e9] rounded-full text-[#62625b] border border-transparent hover:border-[#dadad3] transition-colors"
  >
    <span class="material-symbols-outlined text-xl">search</span>
    <input
      type="text"
      [placeholder]="isProfilePage() ? 'Tìm kiếm Ghim của bạn' : 'Tìm kiếm'"
      class="bg-transparent border-none outline-none w-full text-sm text-black placeholder-[#91918c]"
      (click)="$event.stopPropagation()"
      (keyup.enter)="onSearchSubmit($event)"
    />
    <!-- Camera Search Icon -->
    <span
      class="material-symbols-outlined text-xl text-[#62625b] hover:text-black cursor-pointer select-none"
      title="Tìm kiếm bằng hình ảnh"
    >
      photo_camera
    </span>
  </div>
  <div *ngIf="!supabaseService.user()" class="flex-1"></div>

  <!-- Right Profile Section / Login Button -->
  <div class="flex items-center gap-3">
    <!-- Logged in state -->
    <div class="relative flex items-center" *ngIf="supabaseService.user() as user">
      <!-- Trigger button: avatar + chevron down -->
      <button
        (click)="toggleProfilePopup($event)"
        class="flex items-center gap-1 p-1 hover:bg-[#f6f6f3] rounded-full transition-all duration-200 cursor-pointer select-none border-none outline-none focus:outline-none"
        aria-label="Menu tài khoản"
      >
        <img
          [src]="
            user.user_metadata['avatar_url'] ||
            user.user_metadata['picture'] ||
            'https://api.dicebear.com/7.x/bottts/svg'
          "
          alt="Avatar"
          class="w-8 h-8 rounded-full border border-[#dadad3] object-cover"
        />
        <span
          class="material-symbols-outlined text-[20px] text-[#211922] font-semibold leading-none select-none"
          >keyboard_arrow_down</span
        >
      </button>

      <!-- Profile Dropdown Popup -->
      <div
        *ngIf="showProfilePopup()"
        class="absolute right-0 top-12 mt-2 w-80 bg-white rounded-[24px] shadow-[0_16px_48px_rgba(0,0,0,0.12)] border border-[#dadad3] p-4 flex flex-col gap-3.5 z-50 animate-fade-in text-left"
      >
        <!-- Header: Đang đăng nhập -->
        <span class="text-[12px] text-[#211922] font-normal px-2 select-none">
          Đang đăng nhập
        </span>

        <!-- User Card -->
        <div class="flex items-center gap-3.5 rounded-3xl bg-white select-none">
          <img
            [src]="
              user.user_metadata['avatar_url'] ||
              user.user_metadata['picture'] ||
              'https://api.dicebear.com/7.x/bottts/svg'
            "
            alt="Avatar"
            class="w-14 h-14 rounded-full border border-[#dadad3] object-cover"
          />
          <div class="flex-1 min-w-0 flex flex-col justify-center">
            <!-- Full Name -->
            <span class="text-[15px] font-extrabold text-black truncate leading-tight">
              {{ user.user_metadata['full_name'] || user.email }}
            </span>
            <!-- Email -->
            <span class="text-xs text-[#62625b] truncate mt-0.5 leading-none">
              {{ user.email }}
            </span>
          </div>
        </div>

        <!-- Section: Tài khoản của bạn -->
        <span class="text-[12px] text-[#211922] font-normal px-2 select-none">
          Tài khoản của bạn
        </span>

        <!-- View Profile Option -->
        <button
          (click)="navigateToMyProfile()"
          class="w-full text-left font-bold text-base text-black hover:bg-[#f6f6f3] px-4 py-2 rounded-xl transition-all duration-200 cursor-pointer border-none outline-none select-none"
        >
          Trang cá nhân
        </button>

        <!-- Settings Option -->
        <button
          (click)="navigateToSettings()"
          class="w-full text-left font-bold text-base text-black hover:bg-[#f6f6f3] px-4 py-2 rounded-xl transition-all duration-200 cursor-pointer border-none outline-none select-none"
        >
          Cài đặt
        </button>

        <!-- Sign Out Option -->
        <button
          (click)="signOut()"
          class="w-full text-left font-bold text-base text-[#B15CAA] hover:bg-[#f6f6f3] px-4 py-2 rounded-xl transition-all duration-200 cursor-pointer border-none outline-none select-none"
        >
          Đăng xuất
        </button>
      </div>
    </div>

    <!-- Logged out state: solid Orchid button -->
    <button
      *ngIf="!supabaseService.user()"
      (click)="onLoginClick()"
      class="h-10 px-5 bg-gradient-to-br from-[#E5BDDF] to-[#CF9BC7] hover:from-[#EFCCE9] hover:to-[#D9A9D1] text-[#1D1D1D] font-bold rounded-full transition-all duration-200 cursor-pointer text-sm"
    >
      Đăng nhập
    </button>
  </div>
</header>
