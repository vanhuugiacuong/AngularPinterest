<!-- Left Sidebar: Only display if user is logged in -->
<div
  *ngIf="supabaseService.user()"
  class="fixed top-0 left-0 w-16 h-screen bg-white flex flex-col justify-between items-center py-4 border-r border-[#dadad3] z-50 select-none"
>
  <!-- Top: Logo + Navigation Icons -->
  <div class="flex flex-col items-center gap-5 w-full">
    <!-- Pinterest P Logo -->
    <div
      (click)="onLogoClick()"
      class="w-10 h-10 rounded-full bg-[#e60023] text-white flex items-center justify-center cursor-pointer active:scale-95 transition-transform"
      title="Pinterest AI"
    >
      <span class="material-symbols-outlined text-xl leading-none font-bold">push_pin</span>
    </div>

    <!-- Home Icon (Selected) -->
    <div
      (click)="onLogoClick()"
      class="w-10 h-10 rounded-full flex items-center justify-center cursor-pointer transition-colors"
      [class.bg-black]="isFeedPage()"
      [class.text-white]="isFeedPage()"
      [class.text-black]="!isFeedPage()"
      [class.hover:bg-[#f6f6f3]]="!isFeedPage()"
      title="Trang chủ"
    >
      <span class="material-symbols-outlined text-xl font-bold">home</span>
    </div>

    <!-- Plus/Create Icon -->
    <div
      (click)="navigateToCreate()"
      class="w-10 h-10 rounded-full flex items-center justify-center cursor-pointer transition-colors"
      [class.bg-black]="isCreatePage()"
      [class.text-white]="isCreatePage()"
      [class.text-black]="!isCreatePage()"
      [class.hover:bg-[#f6f6f3]]="!isCreatePage()"
      title="Tạo"
    >
      <span class="material-symbols-outlined text-xl">add</span>
    </div>

    <!-- Notifications Bell Icon -->
    <div
      class="w-10 h-10 rounded-full text-black hover:bg-[#f6f6f3] flex items-center justify-center cursor-pointer transition-colors"
      title="Thông báo"
    >
      <span class="material-symbols-outlined text-xl">notifications</span>
    </div>

    <!-- Chat/Message Icon -->
    <div
      class="w-10 h-10 rounded-full text-black hover:bg-[#f6f6f3] flex items-center justify-center cursor-pointer transition-colors"
      title="Tin nhắn"
    >
      <span class="material-symbols-outlined text-xl">sms</span>
    </div>
  </div>

  <!-- Bottom: Settings -->
  <div class="w-full flex justify-center">
    <div
      class="w-10 h-10 rounded-full text-black hover:bg-[#f6f6f3] flex items-center justify-center cursor-pointer transition-colors"
      title="Cài đặt"
    >
      <span class="material-symbols-outlined text-xl">settings</span>
    </div>
  </div>
</div>

<!-- Header (Navbar) -->
<header
  [class.left-16]="supabaseService.user()"
  [class.left-0]="!supabaseService.user()"
  class="fixed top-0 right-0 h-16 bg-white border-b border-[#dadad3] flex items-center justify-between px-6 z-40"
>
  <!-- Left Side: Show logo inside navbar ONLY when logged out -->
  <div
    *ngIf="!supabaseService.user()"
    (click)="onLogoClick()"
    class="flex items-center gap-2 cursor-pointer select-none"
  >
    <div class="w-8 h-8 rounded-full bg-[#e60023] text-white flex items-center justify-center">
      <span class="material-symbols-outlined text-lg leading-none font-bold">push_pin</span>
    </div>
    <span class="text-xl font-bold text-[#e60023] tracking-tight">Pinterest AI</span>
  </div>

  <!-- Center Search Bar -->
  <div
    (click)="!supabaseService.user() ? onLoginClick() : null"
    [class.cursor-pointer]="!supabaseService.user()"
    class="flex-1 mx-4 flex items-center gap-2 px-4 h-11 bg-[#e9e9e9] rounded-full text-[#62625b] border border-transparent hover:border-[#dadad3] transition-colors"
  >
    <span class="material-symbols-outlined text-xl">search</span>
    <input
      *ngIf="supabaseService.user()"
      type="text"
      [placeholder]="isProfilePage() ? 'Tìm kiếm Ghim của bạn' : 'Tìm kiếm'"
      class="bg-transparent border-none outline-none w-full text-sm text-black placeholder-[#91918c]"
      (click)="$event.stopPropagation()"
    />
    <span
      *ngIf="!supabaseService.user()"
      class="text-xs text-[#91918c] select-none"
    >
      Tìm kiếm cách nấu món ăn, hay mẹo về thời trang, v.v.
    </span>
    <!-- Camera Search Icon -->
    <span
      *ngIf="supabaseService.user()"
      class="material-symbols-outlined text-xl text-[#62625b] hover:text-black cursor-pointer select-none"
      title="Tìm kiếm bằng hình ảnh"
    >
      photo_camera
    </span>
  </div>

  <!-- Right Profile Section / Login Button -->
  <div class="flex items-center gap-3">
    <!-- Logged in state -->
    <div class="relative flex items-center gap-0.5" *ngIf="supabaseService.user() as user">
      <!-- 1. Avatar button: Navigates directly to user profile -->
      <button
        (click)="navigateToMyProfile()"
        class="p-1 hover:bg-[#f6f6f3] rounded-full transition-all duration-200 cursor-pointer select-none border-none outline-none focus:outline-none flex items-center justify-center"
        title="Trang cá nhân của bạn"
        aria-label="Trang cá nhân"
      >
        <img
          [src]="
            user.user_metadata['avatar_url'] ||
            user.user_metadata['picture'] ||
            'https://api.dicebear.com/7.x/bottts/svg'
          "
          alt="Avatar"
          class="w-8 h-8 rounded-full border border-[#dadad3] object-cover"
        />
      </button>

      <!-- 2. Chevron Down Arrow button: Toggles dropdown popup -->
      <button
        (click)="toggleProfilePopup($event)"
        class="w-6 h-6 hover:bg-[#f6f6f3] rounded-full transition-all duration-200 cursor-pointer select-none border-none outline-none focus:outline-none flex items-center justify-center"
        title="Menu tài khoản"
        aria-label="Menu tài khoản"
      >
        <span
          class="material-symbols-outlined text-[20px] text-[#211922] font-semibold leading-none select-none"
          >keyboard_arrow_down</span
        >
      </button>

      <!-- Profile Dropdown Popup -->
      <div
        *ngIf="showProfilePopup()"
        class="absolute right-0 top-12 mt-2 w-80 bg-white rounded-[24px] shadow-[0_16px_48px_rgba(0,0,0,0.12)] border border-[#dadad3] p-4 flex flex-col gap-3.5 z-50 animate-fade-in text-left"
      >
        <!-- Header: Đang đăng nhập -->
        <span class="text-[12px] text-[#211922] font-normal px-2 select-none">
          Đang đăng nhập
        </span>

        <!-- User Card: Click to navigate directly to user profile -->
        <div 
          (click)="navigateToMyProfile()"
          class="flex items-center gap-3.5 p-2 rounded-2xl bg-white hover:bg-[#f6f6f3] cursor-pointer transition-colors select-none"
        >
          <img
            [src]="
              user.user_metadata['avatar_url'] ||
              user.user_metadata['picture'] ||
              'https://api.dicebear.com/7.x/bottts/svg'
            "
            alt="Avatar"
            class="w-14 h-14 rounded-full border border-[#dadad3] object-cover"
          />
          <div class="flex-1 min-w-0 flex flex-col justify-center">
            <!-- Full Name -->
            <span class="text-[15px] font-extrabold text-black truncate leading-tight">
              {{ user.user_metadata['full_name'] || user.email }}
            </span>
            <!-- Email -->
            <span class="text-xs text-[#62625b] truncate mt-0.5 leading-none">
              {{ user.email }}
            </span>
          </div>
        </div>

        <!-- Section: Tài khoản của bạn -->
        <span class="text-[12px] text-[#211922] font-normal px-2 select-none">
          Tài khoản của bạn
        </span>

        <!-- View Profile Option -->
        <button
          (click)="navigateToMyProfile()"
          class="w-full text-left font-bold text-base text-black hover:bg-[#f6f6f3] px-4 py-2 rounded-xl transition-all duration-200 cursor-pointer border-none outline-none select-none"
        >
          Trang cá nhân
        </button>

        <!-- Sign Out Option -->
        <button
          (click)="signOut()"
          class="w-full text-left font-bold text-base text-[#e60023] hover:bg-[#f6f6f3] px-4 py-2 rounded-xl transition-all duration-200 cursor-pointer border-none outline-none select-none"
        >
          Đăng xuất
        </button>
      </div>
    </div>

    <!-- Logged out state: Red Log in Button -->
    <button
      *ngIf="!supabaseService.user()"
      (click)="onLoginClick()"
      class="h-10 px-4 bg-[#e60023] hover:bg-[#cc001f] text-white font-bold rounded-full transition-all duration-200 cursor-pointer text-sm"
    >
      Đăng nhập
    </button>
  </div>
</header>
