<!-- Collapsible left sidebar (overlay, only for authenticated users) -->
<app-sidebar *ngIf="supabaseService.user()" />

<!-- Sticky header — three hairline-separated zones instead of one glass bar -->
<header
  class="nf-header fixed top-0 inset-x-0 h-16 flex items-center gap-2 sm:gap-4 px-3 sm:px-6 z-50 bg-bg/92 backdrop-blur-md border-b border-border"
>
  <!-- Left cluster: hamburger (logged in) + logo -->
  <div class="flex items-center gap-2 shrink-0">
    <button
      #sidebarTrigger
      type="button"
      *ngIf="supabaseService.user()"
      (click)="sidebarState.toggle()"
      (mouseenter)="onSidebarTriggerEnter()"
      (mouseleave)="onSidebarTriggerLeave()"
      (focus)="onSidebarTriggerEnter()"
      class="relative flex h-11 w-11 shrink-0 items-center justify-center rounded-control text-text transition-colors duration-150 hover:bg-surface-elevated focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-bg cursor-pointer"
      [attr.aria-label]="sidebarState.isOpen() ? 'Đóng menu điều hướng' : 'Mở menu điều hướng'"
      [attr.aria-expanded]="sidebarState.isOpen()"
      aria-controls="app-sidebar-panel"
    >
      <!-- Always the menu glyph — the sidebar opens on hover/click and closes
           on mouseleave/backdrop/Escape, so there is no separate "close" icon
           state to represent here. -->
      <span class="material-symbols-outlined text-2xl">menu</span>
    </button>

    <div
      (click)="onLogoClick()"
      class="flex items-center gap-2 cursor-pointer select-none rounded-control px-1.5 py-1 transition-colors duration-200 hover:bg-surface-elevated/60"
    >
      <img src="/logo-mark.png" alt="NovaFrame" class="h-8 w-8 object-contain" />
      <span class="hidden sm:inline text-lg font-extrabold text-gradient-brand tracking-tight">NovaFrame</span>
    </div>
  </div>

  <!-- Center Search Bar — soft control shape with focus-sweep underline instead of a pill -->
  <div
    (click)="!supabaseService.user() ? onLoginClick() : null"
    [class.cursor-pointer]="!supabaseService.user()"
    class="nf-search flex-1 max-w-2xl mx-auto flex items-center gap-2 px-4 h-11 rounded-control text-text-muted bg-surface border border-border transition-colors duration-200 hover:border-border-strong"
  >
    <span class="material-symbols-outlined text-xl">search</span>
    <input
      *ngIf="supabaseService.user()"
      type="text"
      [placeholder]="isProfilePage() ? 'Tìm kiếm bài đăng của bạn' : 'Tìm kiếm'"
      class="bg-transparent border-none outline-none w-full text-sm text-text placeholder-text-muted"
      (click)="$event.stopPropagation()"
    />
    <span
      *ngIf="!supabaseService.user()"
      class="text-xs text-text-muted select-none truncate"
    >
      Tìm kiếm cách nấu món ăn, hay mẹo về thời trang, v.v.
    </span>
    <!-- Camera Search Icon -->
    <span
      *ngIf="supabaseService.user()"
      class="material-symbols-outlined text-xl text-text-muted hover:text-accent transition-colors duration-200 cursor-pointer select-none"
      title="Tìm kiếm bằng hình ảnh"
    >
      photo_camera
    </span>
  </div>

  <!-- Right Profile Section / Login Button -->
  <div class="flex items-center gap-3 shrink-0">
    <!-- Logged in state -->
    <div class="relative flex items-center" *ngIf="supabaseService.user() as user">
      <!-- Trigger button: avatar in soft frame + chevron down -->
      <button
        (click)="toggleProfilePopup($event)"
        class="flex h-11 items-center gap-1.5 pl-1 pr-2.5 hover:bg-surface-elevated rounded-control transition-colors duration-200 cursor-pointer select-none border-none outline-none focus-visible:ring-2 focus-visible:ring-accent"
        aria-label="Menu tài khoản"
      >
        <img
          [src]="
            user.user_metadata['avatar_url'] ||
            user.user_metadata['picture'] ||
            'https://api.dicebear.com/7.x/bottts/svg'
          "
          alt="Avatar"
          class="w-9 h-9 rounded-full object-cover ring-1 ring-primary/30 ring-offset-1 ring-offset-bg"
        />
        <span
          class="material-symbols-outlined text-[20px] text-text-muted font-semibold leading-none select-none"
          >keyboard_arrow_down</span
        >
      </button>

      <!-- Profile Dropdown Popup -->
      <div
        *ngIf="showProfilePopup()"
        class="glass-elevated absolute right-0 top-12 mt-2 w-80 rounded-panel shadow-card p-4 flex flex-col gap-3.5 z-50 animate-fade-in text-left"
      >
        <!-- Header: Đang đăng nhập -->
        <span class="mono-label text-[10px] uppercase text-text-muted font-medium px-2 select-none">
          Đang đăng nhập
        </span>

        <!-- User Card -->
        <div class="flex items-center gap-3.5 select-none">
          <img
            [src]="
              user.user_metadata['avatar_url'] ||
              user.user_metadata['picture'] ||
              'https://api.dicebear.com/7.x/bottts/svg'
            "
            alt="Avatar"
            class="w-14 h-14 shrink-0 rounded-full object-cover ring-1 ring-primary/30 ring-offset-2 ring-offset-surface-high"
          />
          <div class="flex-1 min-w-0 flex flex-col justify-center">
            <!-- Full Name -->
            <span class="text-[15px] font-extrabold text-text truncate leading-tight">
              {{ user.user_metadata['full_name'] || user.email }}
            </span>
            <!-- Email -->
            <span class="text-xs text-text-muted truncate mt-0.5 leading-none">
              {{ user.email }}
            </span>
          </div>
        </div>

        <!-- Section: Tài khoản của bạn -->
        <span class="mono-label text-[10px] uppercase text-text-muted font-medium px-2 select-none">
          Tài khoản của bạn
        </span>

        <!-- View Profile Option -->
        <button
          (click)="navigateToMyProfile()"
          class="w-full text-left font-bold text-base text-text hover:bg-surface-elevated px-4 py-2 rounded-control transition-colors duration-200 cursor-pointer border-none outline-none select-none focus-visible:ring-2 focus-visible:ring-accent"
        >
          Trang cá nhân
        </button>

        <!-- Sign Out Option -->
        <button
          (click)="signOut()"
          class="w-full text-left font-bold text-base text-error hover:bg-surface-elevated px-4 py-2 rounded-control transition-colors duration-200 cursor-pointer border-none outline-none select-none focus-visible:ring-2 focus-visible:ring-accent"
        >
          Đăng xuất
        </button>
      </div>
    </div>

    <!-- Logged out state: signature CTA -->
    <button
      *ngIf="!supabaseService.user()"
      (click)="onLoginClick()"
      class="h-10 px-5 bg-gradient-brand cta-shape text-text font-bold cursor-pointer text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-bg"
    >
      Đăng nhập
    </button>
  </div>
</header>
