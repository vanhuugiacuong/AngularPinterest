<!-- Full-screen backdrop + centered panel, mirrors the modal pattern used
     elsewhere in the app (e.g. board creation) but self-contained here. -->
<div
  class="fixed inset-0 z-[200] flex items-center justify-center overflow-y-auto bg-ink/70 backdrop-blur-sm p-4 sm:p-6"
  (click)="close()"
>
  <div
    #panel
    tabindex="-1"
    (click)="$event.stopPropagation()"
    class="glass-elevated w-full max-w-2xl rounded-panel shadow-card p-6 sm:p-8 flex flex-col gap-6 animate-fade-in my-6 sm:my-12 max-h-[90vh] overflow-y-auto focus:outline-none border border-border"
    role="dialog"
    aria-modal="true"
    aria-label="Tải hình ảnh lên để tìm kiếm"
  >
    <div class="flex items-center justify-between border-b border-border pb-4">
      <div class="flex items-center gap-2.5">
        <span class="material-symbols-outlined text-2xl text-accent" aria-hidden="true">image_search</span>
        <h2 class="text-base sm:text-lg font-bold text-text font-display">Tải hình ảnh lên để tìm kiếm</h2>
      </div>
      <button
        type="button"
        (click)="close()"
        class="w-9 h-9 rounded-control flex items-center justify-center text-text-muted hover:text-text hover:bg-surface-elevated cursor-pointer border-none outline-none focus-visible:ring-2 focus-visible:ring-accent transition-colors"
        aria-label="Đóng"
      >
        <span class="material-symbols-outlined text-xl" aria-hidden="true">close</span>
      </button>
    </div>

    <!-- Drop zone / file picker -->
    @if (!localPreviewUrl()) {
      <label
        tabindex="0"
        role="button"
        (keydown.enter)="fileInput.click()"
        (keydown.space)="$event.preventDefault(); fileInput.click()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        [class.border-accent]="isDragging()"
        [class.border-border]="!isDragging()"
        class="flex flex-col items-center justify-center gap-3 h-64 sm:h-72 rounded-2xl border-2 border-dashed bg-surface/70 hover:bg-surface-elevated/80 cursor-pointer transition-colors duration-200 text-center px-6 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent group"
      >
        <div class="w-16 h-16 rounded-full bg-accent/10 border border-accent/20 flex items-center justify-center text-accent group-hover:scale-110 transition-transform duration-200">
          <span class="material-symbols-outlined text-3xl" aria-hidden="true">add_photo_alternate</span>
        </div>
        <div class="flex flex-col gap-1 items-center">
          <span class="text-sm sm:text-base font-bold text-text">Kéo & thả ảnh vào đây</span>
          <span class="text-xs text-text-muted">hoặc bấm để chọn ảnh từ thiết bị của bạn — JPG, PNG, WebP, tối đa 10MB</span>
        </div>
        <input
          #fileInput
          type="file"
          accept="image/jpeg,image/jpg,image/png,image/webp"
          class="hidden"
          (change)="onFileInputChange($event)"
        />
      </label>
    } @else {
      <div class="relative rounded-2xl overflow-hidden bg-surface border border-border p-2">
        <img [src]="localPreviewUrl()" alt="Ảnh xem trước" class="w-full max-h-96 object-contain rounded-xl" />
        <button
          type="button"
          (click)="removeSelectedFile()"
          [disabled]="store.isLoading()"
          class="absolute top-4 right-4 w-9 h-9 rounded-control bg-surface-high/90 border border-border-strong flex items-center justify-center text-text-muted hover:text-text cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed focus-visible:ring-2 focus-visible:ring-accent shadow-card"
          aria-label="Chọn ảnh khác"
          title="Chọn ảnh khác"
        >
          <span class="material-symbols-outlined text-lg" aria-hidden="true">refresh</span>
        </button>
      </div>
    }

    <!-- Client-side validation error -->
    @if (validationError()) {
      <p class="text-xs text-error flex items-center gap-1.5 p-3 rounded-control bg-error/10 border border-error/20" role="alert">
        <span class="material-symbols-outlined text-base leading-none" aria-hidden="true">error</span>
        {{ validationError() }}
      </p>
    }

    <!-- Search error (network/CLIP service) -->
    @if (store.error()) {
      <p class="text-xs text-error flex items-center gap-1.5 p-3 rounded-control bg-error/10 border border-error/20" role="alert">
        <span class="material-symbols-outlined text-base leading-none" aria-hidden="true">cloud_off</span>
        {{ store.error() }}
      </p>
    }

    <div class="flex items-center justify-end gap-3 pt-2">
      <button
        type="button"
        (click)="close()"
        [disabled]="store.isLoading()"
        class="h-11 px-5 rounded-control bg-surface border border-border hover:border-border-strong text-xs sm:text-sm font-bold text-text-muted hover:text-text cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed focus-visible:ring-2 focus-visible:ring-accent"
      >
        Hủy
      </button>
      <button
        type="button"
        (click)="runSearch()"
        [disabled]="!selectedFile() || store.isLoading()"
        class="h-11 px-6 bg-gradient-brand rounded-control text-text-on-accent font-bold text-xs sm:text-sm cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
      >
        @if (store.isLoading()) {
          <span class="material-symbols-outlined text-base animate-spin leading-none" aria-hidden="true">progress_activity</span>
          Đang tìm kiếm...
        } @else {
          <span class="material-symbols-outlined text-lg leading-none" aria-hidden="true">search</span>
          Tìm kiếm bằng ảnh này
        }
      </button>
    </div>
  </div>
</div>
