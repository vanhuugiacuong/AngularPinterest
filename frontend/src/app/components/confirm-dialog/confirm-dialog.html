<div
  *ngIf="confirmService.current() as dialog"
  class="fixed inset-0 bg-black/60 backdrop-blur-md z-[90] flex items-center justify-center p-4 animate-fade-in"
  (click)="confirmService.respond(false)"
>
  <div
    class="bg-[#1e1e1e] w-full max-w-[400px] rounded-[28px] p-6 shadow-[0_30px_70px_rgba(0,0,0,0.6)] flex flex-col gap-4 text-left border border-white/10"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-start gap-3.5">
      <span
        class="shrink-0 w-11 h-11 rounded-2xl flex items-center justify-center"
        [class.bg-[#2a151b]]="dialog.danger"
        [class.text-[#ff5c7a]]="dialog.danger"
        [class.bg-[#241a2e]]="!dialog.danger"
        [class.text-[#c98be0]]="!dialog.danger"
      >
        <span class="material-symbols-outlined text-[22px] leading-none" style="font-variation-settings: 'FILL' 1, 'wght' 600;">
          {{ dialog.danger ? 'warning' : 'help' }}
        </span>
      </span>
      <div class="flex-1 min-w-0 pt-1">
        <h2 class="text-base font-extrabold text-white leading-snug">{{ dialog.title }}</h2>
        <p class="text-[13px] text-[#a29aac] mt-1 leading-snug">{{ dialog.message }}</p>
      </div>
    </div>

    <div class="flex gap-2.5 justify-end mt-1">
      <button
        (click)="confirmService.respond(false)"
        class="h-10 px-5 rounded-full font-bold text-sm text-white bg-white/[0.06] border border-white/10 hover:bg-white/10 transition-colors cursor-pointer outline-none"
      >
        {{ dialog.cancelLabel }}
      </button>
      <button
        (click)="confirmService.respond(true)"
        class="h-10 px-5 rounded-full font-bold text-sm text-white transition-all hover:-translate-y-0.5 cursor-pointer border-none outline-none"
        [class.bg-gradient-to-r]="dialog.danger"
        [class.from-[#ff5c7a]]="dialog.danger"
        [class.to-[#e11d48]]="dialog.danger"
        [class.shadow-[0_10px_24px_-8px_rgba(225,29,72,0.6)]]="dialog.danger"
        [class.grad-brand]="!dialog.danger"
        [class.shadow-[0_10px_24px_-8px_rgba(249,64,131,0.6)]]="!dialog.danger"
      >
        {{ dialog.confirmLabel }}
      </button>
    </div>
  </div>
</div>
