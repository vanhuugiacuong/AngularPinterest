<div class="money-input" [class.money-input--disabled]="disabled">
  <input
    [id]="inputId"
    type="text"
    inputmode="numeric"
    autocomplete="off"
    [value]="displayValue"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [attr.aria-label]="ariaLabel"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    class="money-input__field"
  />
  <span class="money-input__suffix" aria-hidden="true">{{ suffix }}</span>
</div>
