<button
  type="button"
  class="heart-container"
  [class.heart-container--compact]="size() === 'compact'"
  [class.heart-container--with-count]="count() !== null"
  [class.is-liked]="liked()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-pressed]="liked()"
  [title]="ariaLabel()"
  [disabled]="disabled()"
  (click)="onClick($event)"
>
  <span class="svg-container" aria-hidden="true">
    <svg class="svg-outline" viewBox="0 0 24 24">
      <path
        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"
      />
    </svg>

    <svg class="svg-filled" viewBox="0 0 24 24">
      <path
        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"
      />
    </svg>

    <svg class="svg-celebrate" viewBox="0 0 100 100">
      <path d="M50 4v16M50 80v16M4 50h16M80 50h16M17.5 17.5l11.3 11.3M71.2 71.2l11.3 11.3M82.5 17.5 71.2 28.8M28.8 71.2 17.5 82.5" />
    </svg>
  </span>

  @if (count() !== null) {
    <span class="like-count" aria-hidden="true">{{ count() }}</span>
  }
</button>
