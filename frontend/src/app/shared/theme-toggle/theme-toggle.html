<label class="switch" [attr.title]="isDark ? 'Đang bật giao diện tối' : 'Đang bật giao diện sáng'">
  <input
    [id]="inputId"
    class="switch-input"
    type="checkbox"
    [checked]="isDark"
    (change)="onToggle($any($event.target).checked)"
    [attr.aria-label]="isDark ? 'Giao diện tối đang bật — bấm để chuyển sang giao diện sáng' : 'Giao diện sáng đang bật — bấm để chuyển sang giao diện tối'"
  />
  <span class="slider round">
    <span class="sun-moon">
      <svg class="moon-dot moon-dot-1" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" /></svg>
      <svg class="moon-dot moon-dot-2" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" /></svg>
      <svg class="moon-dot moon-dot-3" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" /></svg>

      <svg class="light-ray light-ray-1" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" /></svg>
      <svg class="light-ray light-ray-2" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" /></svg>
      <svg class="light-ray light-ray-3" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" /></svg>

      <svg class="cloud-dark cloud-1" viewBox="0 0 100 60" aria-hidden="true">
        <path d="M20 45 a15 15 0 0 1 2 -29.8 a18 18 0 0 1 34 -6 a14 14 0 0 1 14 15.8 a13 13 0 0 1 -8 20 z" />
      </svg>
      <svg class="cloud-dark cloud-2" viewBox="0 0 100 60" aria-hidden="true">
        <path d="M20 45 a15 15 0 0 1 2 -29.8 a18 18 0 0 1 34 -6 a14 14 0 0 1 14 15.8 a13 13 0 0 1 -8 20 z" />
      </svg>
      <svg class="cloud-dark cloud-3" viewBox="0 0 100 60" aria-hidden="true">
        <path d="M20 45 a15 15 0 0 1 2 -29.8 a18 18 0 0 1 34 -6 a14 14 0 0 1 14 15.8 a13 13 0 0 1 -8 20 z" />
      </svg>
      <svg class="cloud-light cloud-4" viewBox="0 0 100 60" aria-hidden="true">
        <path d="M20 45 a15 15 0 0 1 2 -29.8 a18 18 0 0 1 34 -6 a14 14 0 0 1 14 15.8 a13 13 0 0 1 -8 20 z" />
      </svg>
      <svg class="cloud-light cloud-5" viewBox="0 0 100 60" aria-hidden="true">
        <path d="M20 45 a15 15 0 0 1 2 -29.8 a18 18 0 0 1 34 -6 a14 14 0 0 1 14 15.8 a13 13 0 0 1 -8 20 z" />
      </svg>
      <svg class="cloud-light cloud-6" viewBox="0 0 100 60" aria-hidden="true">
        <path d="M20 45 a15 15 0 0 1 2 -29.8 a18 18 0 0 1 34 -6 a14 14 0 0 1 14 15.8 a13 13 0 0 1 -8 20 z" />
      </svg>
    </span>
    <span class="stars">
      <svg class="star star-1" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" /></svg>
      <svg class="star star-2" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" /></svg>
      <svg class="star star-3" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" /></svg>
      <svg class="star star-4" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" /></svg>
    </span>
  </span>
</label>
