<label class="nf-theme-switch" [attr.title]="isDark ? 'Đang bật giao diện tối' : 'Đang bật giao diện sáng'">
  <input
    [id]="inputId"
    class="nf-theme-switch__input"
    type="checkbox"
    [checked]="isDark"
    (change)="onToggle($any($event.target).checked)"
    [attr.aria-label]="isDark ? 'Giao diện tối đang bật — bấm để chuyển sang giao diện sáng' : 'Giao diện sáng đang bật — bấm để chuyển sang giao diện tối'"
  />
  <span class="nf-theme-switch__track">
    <span class="nf-theme-switch__thumb">
      <span class="material-symbols-outlined icon-fill nf-theme-switch__icon" aria-hidden="true">
        {{ isDark ? 'dark_mode' : 'light_mode' }}
      </span>
    </span>
  </span>
</label>
