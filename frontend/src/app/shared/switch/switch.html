<button
  type="button"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-labelledby]="ariaLabelledby()"
  [attr.data-testid]="testId()"
  [disabled]="disabled()"
  (click)="onClick()"
  [class.bg-gradient-brand]="checked()"
  [class.border-accent/40]="checked()"
  [class.shadow-glow-sm]="checked()"
  [class.bg-surface-elevated]="!checked()"
  [class.border-border-strong]="!checked()"
  class="w-11 h-6 p-1 rounded-full relative inline-flex items-center border cursor-pointer transition-all duration-200 shrink-0 disabled:opacity-50 disabled:cursor-not-allowed focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
>
  <span
    class="block h-4 w-4 rounded-full bg-white shadow-md transform transition-transform duration-200 ease-in-out pointer-events-none"
    [class.translate-x-5]="checked()"
    [class.translate-x-0]="!checked()"
  ></span>
</button>
