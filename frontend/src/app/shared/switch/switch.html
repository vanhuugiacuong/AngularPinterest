<button
  type="button"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-labelledby]="ariaLabelledby()"
  [attr.data-testid]="testId()"
  [disabled]="disabled()"
  (click)="onClick()"
  [class.bg-gradient-brand]="checked()"
  [class.bg-surface-elevated]="!checked()"
  class="w-11 h-6 rounded-full relative border border-border-strong cursor-pointer transition-colors duration-200 shrink-0 disabled:opacity-60 disabled:cursor-wait focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
>
  <span
    class="absolute top-0.5 h-4 w-4 rounded-full bg-text transition-all duration-200"
    [class.left-[22px]]="checked()"
    [class.left-0.5]="!checked()"
  ></span>
</button>
